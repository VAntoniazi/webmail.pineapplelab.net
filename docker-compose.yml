services:
  poste:
    image: analogic/poste.io:latest
    container_name: poste
    restart: always

    hostname: mail.pineapplelab.net

    ports:
      - "25:25"
      - "587:587"
      - "465:465"
      - "993:993"
      - "995:995"
      - "143:143"
      - "110:110"
      - "4190:4190"
      - "8082:80"

    volumes:
      - poste_data:/data

    environment:
      - TZ=America/Sao_Paulo
      - HTTPS=OFF
      - DISABLE_CLAMAV=TRUE
      - DISABLE_RSPAMD=TRUE
      - ENABLE_FAIL2BAN=TRUE

    networks:
      - dokploy-network

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  poste_data:
    driver: local

networks:
  dokploy-network:
    external: true